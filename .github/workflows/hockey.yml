name: Radar 90 Hockey - collecte des matchs

on:
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recuperer les matchs
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, datetime, urllib.request
          key = os.environ["API_KEY"]
          base = "https://v1.hockey.api-sports.io/"
          def get(path):
              req = urllib.request.Request(base + path, headers={"x-apisports-key": key})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)
          today = datetime.date.today()
          os.makedirs("data", exist_ok=True)
          out = {"genere_le": datetime.datetime.utcnow().isoformat() + "Z",
                 "statut_compte": {}}
          st = get("status").get("response", {})
          if isinstance(st, dict):
              out["statut_compte"] = {"abonnement": st.get("subscription"), "requetes": st.get("requests")}
          for label, d in (("hier", today - datetime.timedelta(days=1)),
                           ("aujourdhui", today),
                           ("demain", today + datetime.timedelta(days=1))):
              out[label] = get(f"games?date={d.isoformat()}&timezone=Europe/Paris")
          with open("data/latest.json", "w") as f:
              json.dump(out, f, ensure_ascii=False)
          print("OK", {k: len(v.get("response", [])) for k, v in out.items() if isinstance(v, dict) and "response" in v and k != "statut_compte"})
          PY

      - name: Enregistrer
        run: |
          git config user.name "radar90-hockey-bot"
          git config user.email "radar90-hockey-bot@users.noreply.github.com"
          git add data
          git commit -m "Collecte du $(date +%F)" || echo "rien de nouveau"
          git push
